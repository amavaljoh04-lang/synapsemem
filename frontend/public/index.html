<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>SynapseMem — Coder Memory</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button
          id="drawer-toggle"
          aria-label="Ouvrir le menu"
          aria-controls="drawer"
          aria-expanded="false"
          class="icon-btn"
        >
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <h1>SynapseMem</h1>
        <div id="topbar-status" class="muted"></div>
      </header>

      <aside id="drawer" aria-label="Menu SynapseMem">
        <div class="drawer-section">
          <h2>Projet</h2>
          <select id="project"></select>
          <label class="muted" for="model">Modèle</label>
          <select id="model"></select>
          <button id="refresh" type="button">Rafraîchir</button>
        </div>

        <div class="drawer-section">
          <h2>Générer un projet</h2>
          <form id="generate-form">
            <label class="muted" for="generate-project-id">Project id</label>
            <input
              type="text"
              id="generate-project-id"
              placeholder="ex. tasks-cli"
              required
            />
            <label class="muted" for="generate-goal">Objectif</label>
            <textarea
              id="generate-goal"
              rows="3"
              placeholder="Ex. PWA de to-do list avec auth Google + SQLite côté serveur."
              required
            ></textarea>
            <label class="muted" for="generate-iterations">Itérations max</label>
            <input
              type="number"
              id="generate-iterations"
              min="1"
              max="10"
              value="4"
            />
            <button type="submit" id="generate-submit">Lancer</button>
            <p id="generate-status" class="muted"></p>
          </form>
        </div>

        <div class="drawer-section">
          <h2>Ingérer un projet</h2>
          <form id="ingest-form">
            <label class="muted" for="ingest-project-id">Project id</label>
            <input
              type="text"
              id="ingest-project-id"
              placeholder="ex. mon-app"
              required
            />
            <label
              id="drop-zone"
              for="ingest-file"
              class="drop-zone"
              tabindex="0"
            >
              <span>Dépose un <code>.zip</code> ici ou clique pour choisir.</span>
              <input type="file" id="ingest-file" accept=".zip" hidden />
            </label>
            <button type="submit" id="ingest-submit">Ingérer</button>
            <p id="ingest-status" class="muted"></p>
          </form>
        </div>

        <div class="drawer-section">
          <h2>Promesses ouvertes</h2>
          <ul id="promises" class="muted small"></ul>
        </div>

        <div class="drawer-section">
          <h2>Inspecteur</h2>
          <p class="muted small" id="detail-empty">
            Clique un nœud du graphe.
          </p>
          <pre id="detail"></pre>
        </div>

        <div class="drawer-section">
          <details>
            <summary>Graphe</summary>
            <div id="graph"></div>
          </details>
        </div>
      </aside>

      <div id="drawer-scrim" aria-hidden="true"></div>

      <main id="chat-panel">
        <div id="messages" aria-live="polite"></div>
        <form id="chat-form" autocomplete="off">
          <textarea
            id="chat-input"
            placeholder="Parle au modèle. SynapseMem injecte promesses ouvertes + symboles définis + historique récent avant chaque réponse."
            rows="2"
          ></textarea>
          <div class="chat-actions">
            <label class="muted small">
              <input type="checkbox" id="stream-toggle" checked />
              stream
            </label>
            <button type="submit" id="send">Envoyer</button>
          </div>
        </form>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
