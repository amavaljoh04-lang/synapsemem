<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SynapseMem — Coder Memory</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  </head>
  <body>
    <header>
      <h1>SynapseMem</h1>
      <nav>
        <label for="project">Project</label>
        <select id="project"></select>
        <label for="model">Model</label>
        <select id="model"></select>
        <button id="refresh">Refresh</button>
        <span id="status" class="muted"></span>
      </nav>
    </header>
    <main>
      <section id="chat-panel">
        <div id="messages" aria-live="polite"></div>
        <form id="chat-form">
          <textarea
            id="chat-input"
            placeholder="Parle au modèle. SynapseMem lui injectera les promesses ouvertes et les symboles déjà définis avant chaque réponse."
            rows="3"
          ></textarea>
          <div class="chat-actions">
            <label class="muted">
              <input type="checkbox" id="stream-toggle" checked />
              stream
            </label>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </section>
      <section id="graph"></section>
      <aside id="panel">
        <h2>Ingest a project</h2>
        <form id="ingest-form">
          <label class="muted" for="ingest-project-id">Project id</label>
          <input type="text" id="ingest-project-id" placeholder="my-app" required />
          <label
            id="drop-zone"
            for="ingest-file"
            class="drop-zone"
            tabindex="0"
          >
            <span>Drop a <code>.zip</code> of your project here, or click to pick one.</span>
            <input type="file" id="ingest-file" accept=".zip" hidden />
          </label>
          <button type="submit" id="ingest-submit">Ingest</button>
          <p id="ingest-status" class="muted"></p>
        </form>
        <hr />
        <h2>Inspector</h2>
        <p class="muted">Click a node to see its details here.</p>
        <pre id="detail"></pre>
        <hr />
        <h2>Open promises</h2>
        <ul id="promises" class="muted"></ul>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
